[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "collabsim"
version = "0.5.3"
description = "CollabSim: a state-based small-group student chat simulator (Python package; Claude Haiku words the turns)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Adelson de Araujo" }]
requires-python = ">=3.11"
dependencies = ["pydantic>=2.5", "pyyaml>=6", "anthropic>=0.40"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
collabsim = "collabsim.__main__:main"

[tool.setuptools.packages.find]
include = ["collabsim", "collabsim.*"]

[tool.setuptools.package-data]
collabsim = ["tasks/*.yaml", "tasks/pt-BR/*.yaml", "lang/*.yaml", "llm/*.yaml", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["build", "dist", ".git"]
